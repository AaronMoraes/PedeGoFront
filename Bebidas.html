<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0D0F14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tema.css">
<title>Bebidas · PedeGo</title>
<meta name="description" content="Complete seu pedido com algo gelado.">
</head>
<body data-pagina="bebidas" data-categoria="bebida">
<header id="topo"></header>
<main>
  <div class="wrap">
    <div class="pagina-cab">
      <h1>Bebidas</h1>
      <p>Complete seu pedido com algo gelado.</p>
    </div>
    <div class="ferramentas">
      <div class="busca">
        <span data-icone="search"></span>
        <label class="sr-only" for="busca">Buscar em Bebidas</label>
        <input id="busca" class="entrada" type="search" placeholder="Buscar em Bebidas" autocomplete="off">
      </div>
      <span class="chip" id="contagem" aria-live="polite"></span>
    </div>
    <section class="grade" id="grade" aria-label="Bebidas"></section>
  </div>
  <noscript><p class="wrap vazio">Ative o JavaScript para ver o cardápio.</p></noscript>
</main>
<footer id="rodape"></footer>
<script src="config.js"></script>
<script src="js/app.js"></script>
<script src="js/cardapio.js"></script>
</body>
</html>
